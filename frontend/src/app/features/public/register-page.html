<div class="container py-5">
  <div class="row justify-content-center">
    <div class="col-md-9 col-lg-7 col-xl-6">
      <div class="card shadow-sm">
        <div class="card-body p-4 p-md-5">
          <h1 class="h3 fw-bold mb-1">Créer un compte</h1>
          <p class="text-secondary mb-4">Rejoignez SmartRecruit en tant que candidat ou recruteur.</p>

          @if (error()) {
            <div class="alert alert-danger py-2" role="alert" data-testid="register-error">{{ error() }}</div>
          }

          <form [formGroup]="form" (ngSubmit)="submit()" novalidate>
            <div class="row g-3 mb-3" role="radiogroup" aria-label="Type de compte">
              <div class="col-6">
                <label class="card role-option h-100 p-3" [class.selected]="form.controls.role.value === 'CANDIDAT'">
                  <input class="visually-hidden" type="radio" formControlName="role" value="CANDIDAT" data-testid="role-candidat" />
                  <i aria-hidden="true" class="bi bi-person-badge fs-3 text-primary"></i>
                  <span class="fw-semibold mt-1">Candidat</span>
                  <span class="small text-secondary">Je cherche un emploi</span>
                </label>
              </div>
              <div class="col-6">
                <label class="card role-option h-100 p-3" [class.selected]="form.controls.role.value === 'RECRUTEUR'">
                  <input class="visually-hidden" type="radio" formControlName="role" value="RECRUTEUR" data-testid="role-recruteur" />
                  <i aria-hidden="true" class="bi bi-briefcase fs-3 text-primary"></i>
                  <span class="fw-semibold mt-1">Recruteur</span>
                  <span class="small text-secondary">Je publie des offres</span>
                </label>
              </div>
            </div>

            <div class="row g-3">
              <div class="col-sm-6">
                <label class="form-label required" for="firstName">Prénom</label>
                <input id="firstName" class="form-control" formControlName="firstName" autocomplete="given-name"
                       [class.is-invalid]="form.controls.firstName.touched && form.controls.firstName.invalid" />
                <app-field-error [control]="form.controls.firstName" />
              </div>
              <div class="col-sm-6">
                <label class="form-label required" for="lastName">Nom</label>
                <input id="lastName" class="form-control" formControlName="lastName" autocomplete="family-name"
                       [class.is-invalid]="form.controls.lastName.touched && form.controls.lastName.invalid" />
                <app-field-error [control]="form.controls.lastName" />
              </div>
              <div class="col-12">
                <label class="form-label required" for="email">Email</label>
                <input id="email" type="email" class="form-control" formControlName="email" autocomplete="email"
                       [class.is-invalid]="form.controls.email.touched && form.controls.email.invalid" />
                <app-field-error [control]="form.controls.email" />
              </div>
              <div class="col-sm-6">
                <label class="form-label required" for="password">Mot de passe</label>
                <input id="password" type="password" class="form-control" formControlName="password" autocomplete="new-password"
                       [class.is-invalid]="form.controls.password.touched && form.controls.password.invalid" />
                <app-field-error [control]="form.controls.password"
                                 [messages]="{ pattern: 'Au moins une lettre et un chiffre.', minlength: 'Au moins 8 caractères.' }" />
              </div>
              <div class="col-sm-6">
                <label class="form-label required" for="confirmPassword">Confirmation</label>
                <input id="confirmPassword" type="password" class="form-control" formControlName="confirmPassword"
                       autocomplete="new-password"
                       [class.is-invalid]="form.controls.confirmPassword.touched && form.controls.confirmPassword.invalid" />
                <app-field-error [control]="form.controls.confirmPassword"
                                 [messages]="{ mismatch: 'Les mots de passe ne correspondent pas.' }" />
              </div>
            </div>
            <div class="form-text mb-4">8 caractères minimum, avec au moins une lettre et un chiffre.</div>

            <button class="btn btn-primary w-100" type="submit" [disabled]="loading()">
              @if (loading()) {
                <span class="spinner-border spinner-border-sm me-2"></span>
              }
              Créer mon compte
            </button>
          </form>
          <p class="text-center text-secondary mt-4 mb-0">
            Déjà inscrit ?
            <a routerLink="/login" [queryParams]="returnUrl() ? { returnUrl: returnUrl() } : {}">Se connecter</a>
          </p>
        </div>
      </div>
    </div>
  </div>
</div>
