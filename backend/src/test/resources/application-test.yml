# Profil de test : base H2 en mémoire, aucune dépendance à MySQL ou Docker.
spring:
  datasource:
    url: jdbc:h2:mem:smartrecruit;DB_CLOSE_DELAY=-1
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: create-drop
  flyway:
    enabled: false

app:
  jwt:
    # Valeur réservée aux tests automatisés, sans usage réel.
    secret: test-only-secret-key-for-unit-tests-0123456789abcdef
    expiration-ms: 3600000
